:root{--violet:#6015F5;--deep:#26068D;--red:#EF001B;--ink:#17171F;--lilac:#A98BFF;--mist:#BDB8DA;--line:rgba(189,184,218,.24);--ok:#3DDC97;
 --display:'Orbitron',system-ui,sans-serif;--body:'Montserrat',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:#fff;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lilac);outline-offset:3px}
.bg{position:fixed;inset:0;background:radial-gradient(60vmax 50vmax at 8% -10%,rgba(96,21,245,.5),transparent 60%),radial-gradient(55vmax 45vmax at 105% 110%,rgba(38,6,141,.85),transparent 60%),var(--ink)}
#net,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:60}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:980px;margin:0 auto}

/* topo */
.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px}
.top img{height:28px;border-radius:8px;background:#fff;padding:3px 6px}
.steps{flex:1;display:flex;gap:5px}
.steps button{flex:1;height:22px;border:0;background:none;padding:0;cursor:pointer;position:relative}
.steps button::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:rgba(255,255,255,.15);transition:.3s}
.steps button.done::before{background:var(--lilac)}
.steps button.cur::before{background:var(--red);box-shadow:0 0 10px rgba(239,0,27,.8)}
.xp{font:700 .72rem var(--display);letter-spacing:.08em;color:var(--mist);white-space:nowrap}
.xp b{color:#fff;font-size:.9rem}
.snd{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);cursor:pointer;display:grid;place-items:center;padding:0;font-size:1rem}

/* coach */
.coach{display:flex;gap:10px;align-items:flex-end;padding:4px 14px 6px}
.bot{flex:none;width:64px;height:64px;filter:drop-shadow(0 0 14px rgba(96,21,245,.8))}
.bot .pup{transition:transform .3s var(--ease)}
.bot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bot.think .pup{transform:translate(2px,-3px)}
.bot.wow{animation:hop .5s var(--ease)}
@keyframes hop{50%{transform:translateY(-12px) scale(1.06)}}
.speech{position:relative;flex:1;padding:.65em 1em;border-radius:18px;border-bottom-left-radius:5px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line);font-size:.92rem;line-height:1.4;min-height:3.1em;backdrop-filter:blur(8px)}
.speech b{color:var(--lilac)}

/* palco */
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 14px 18px;scroll-behavior:smooth}
.lvl{animation:in .5s var(--ease) both;max-width:880px;margin:0 auto}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:.7em;font:500 .68rem var(--display);letter-spacing:.28em;text-transform:uppercase;color:var(--mist);margin:.3rem 0 .6rem}
.eyebrow::before{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--red);box-shadow:0 0 12px rgba(239,0,27,.8)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-weight:900;font-size:clamp(1.8rem,6vw,3.2rem)}
h2{font-weight:800;font-size:clamp(1.3rem,4vw,2rem)}
h3{font-weight:700;font-size:1rem}
.g{background:linear-gradient(95deg,#C9B6FF,#8E5CFF 60%,#6B2BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--red);margin-left:.06em;box-shadow:0 0 18px rgba(239,0,27,.85)}
.lead{color:var(--mist);margin:.6rem 0 0;max-width:62ch}
.card{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(8px);min-width:0}
.grid{display:grid;gap:12px}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.btn{border:1px solid rgba(255,255,255,.4);background:linear-gradient(130deg,var(--violet),var(--deep));border-radius:99px;padding:.7em 1.3em;font-weight:700;cursor:pointer;box-shadow:0 10px 30px -10px rgba(96,21,245,.95);transition:transform .15s,filter .2s,opacity .2s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;border-color:var(--line);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:.5em 1em;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font:700 .62rem var(--display);letter-spacing:.2em;color:var(--lilac);text-transform:uppercase}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--deep),var(--violet),var(--lilac));transition:width .5s var(--ease)}
.big{font:900 2rem/1 var(--display)}
.note{font-size:.8rem;color:var(--mist);margin:.5rem 0 0}

/* intro */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:1rem 0}
@media (max-width:620px){.flow{grid-template-columns:repeat(2,1fr)}}
.stp{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:20px;padding:14px 8px;text-align:center;cursor:pointer;transition:.35s var(--ease)}
.stp .e{font-size:2rem;display:block;transition:transform .35s var(--ease)}
.stp small{display:block;font:700 .6rem var(--display);letter-spacing:.16em;color:var(--lilac);margin-top:.4rem}
.stp b{display:block;font-size:.85rem;margin-top:.1rem}
.stp.on{background:linear-gradient(150deg,var(--violet),var(--deep));border-color:#fff;box-shadow:0 0 0 3px rgba(169,139,255,.3),0 14px 40px -12px rgba(96,21,245,1);transform:translateY(-4px)}
.stp.on .e{transform:scale(1.25)}
.detail{min-height:4.4em;padding:14px 16px;border-radius:18px;border:1px dashed var(--lilac);background:rgba(96,21,245,.12);font-size:.95rem}
.demo{position:relative;height:88px;margin-top:12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04);overflow:hidden}
.demo .belt{position:absolute;left:0;right:0;bottom:14px;height:6px;background:repeating-linear-gradient(90deg,rgba(169,139,255,.55) 0 14px,transparent 14px 28px);animation:belt 1s linear infinite}
@keyframes belt{to{background-position:28px 0}}
.demo .tok{position:absolute;bottom:26px;left:-60px;font-size:2.2rem;transition:left 1.2s var(--ease)}
.demo .lab{position:absolute;bottom:62px;font:700 .75rem var(--body);padding:.25em .7em;border-radius:99px;background:var(--red);opacity:0;transform:scale(.4);transition:.4s var(--ease)}
.demo .lab.show{opacity:1;transform:none}
.demo .brain{position:absolute;right:16px;top:12px;font-size:2.4rem;transition:.4s}
.demo .brain.glow{filter:drop-shadow(0 0 14px #A98BFF);transform:scale(1.2)}
.demo .out{position:absolute;right:70px;top:18px;font:700 .85rem var(--body);opacity:0;transition:.4s}
.demo .out.show{opacity:1}

/* plano */
.plotbox{position:relative;width:100%;max-width:480px;aspect-ratio:1;margin:0 auto 10px}
.plot{position:absolute;inset:0 0 22px 22px;border-radius:20px;border:1px solid var(--line);overflow:hidden;background:rgba(255,255,255,.04);touch-action:manipulation}
.plot canvas{position:absolute;inset:0;width:100%;height:100%}
.ax{position:absolute;font:600 .62rem var(--display);letter-spacing:.1em;color:var(--mist);text-transform:uppercase;white-space:nowrap}
.ax.x{bottom:0;left:50%;transform:translateX(-50%)}
.ax.y{left:0;top:50%;transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center}
.pt{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(23,23,31,.75);cursor:pointer;display:grid;place-items:center;font-size:1.15rem;padding:0;transition:transform .2s var(--ease),border-color .3s,box-shadow .3s;animation:ptin .5s var(--ease) both}
@keyframes ptin{from{transform:scale(0)}to{transform:none}}
.pt:hover{transform:scale(1.15)}
.pt.q{font:800 .9rem var(--display);color:var(--mist);border-style:dashed}
.pt.l0{border-color:var(--lilac);box-shadow:0 0 14px rgba(169,139,255,.8)}
.pt.l1{border-color:#FF5468;box-shadow:0 0 14px rgba(239,0,27,.8)}
.pt.pop{animation:pop .4s var(--ease)}
@keyframes pop{40%{transform:scale(1.5)}}
.pt.ok{border-color:var(--ok);box-shadow:0 0 16px rgba(61,220,151,.9)}
.pt.no{border-color:#FF3B52;box-shadow:0 0 16px rgba(239,0,27,.95);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pt.faint{opacity:.45;width:24px;height:24px;margin:-12px 0 0 -12px;font-size:.8rem;pointer-events:none}
.pt .pred{position:absolute;top:-18px;font-size:.9rem;animation:ptin .3s both}
.brush{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.brush button{border:1.5px solid var(--line);background:rgba(255,255,255,.06);border-radius:18px;padding:.7em;font-weight:700;cursor:pointer;transition:.2s}
.brush button[aria-pressed=true]{border-color:#fff;background:linear-gradient(150deg,var(--violet),var(--deep));box-shadow:0 0 0 3px rgba(169,139,255,.3)}
.brush .e{font-size:1.5rem;display:block}
.brain{display:flex;gap:4px;flex-wrap:wrap}
.brain i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.12);transition:.4s}
.brain i.on{background:var(--lilac);box-shadow:0 0 10px var(--lilac)}
.score{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--lilac) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex:none;transition:.4s}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font:900 1.2rem var(--display)}
.chart{width:100%;height:auto;display:block}
.chart text{font:600 9px var(--body);fill:var(--mist)}
input[type=range]{width:100%;accent-color:var(--violet);height:28px}
.toggle{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:600;font-size:.9rem}
.toggle input{accent-color:var(--red);width:20px;height:20px}

/* pixels */
.cv{display:block;width:100%;max-width:420px;aspect-ratio:1;margin:0 auto;border-radius:16px;border:1px solid var(--line);image-rendering:pixelated;touch-action:none;cursor:crosshair}
.insp{font:600 .85rem var(--body);min-height:2.6em;margin-top:8px;text-align:center;color:var(--mist)}
.insp b{color:#fff}
.sw{height:96px;border-radius:18px;border:2px solid rgba(255,255,255,.5);transition:background .1s}
.rgb label{display:grid;grid-template-columns:22px 1fr 40px;align-items:center;gap:8px;font:700 .85rem var(--display);margin:.2rem 0}
.rgb input.r{accent-color:#ff4d5e}.rgb input.gg{accent-color:#3DDC97}.rgb input.b{accent-color:#5b8cff}
.tgt{display:flex;gap:10px;align-items:center}
.tgt .sw{flex:1;height:64px}
.vec{font:600 .78rem ui-monospace,Menlo,monospace;color:var(--lilac);background:rgba(0,0,0,.35);border-radius:14px;padding:10px 12px;word-break:break-all;min-height:4em;line-height:1.5}
.gridn{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:320px;margin:0 auto}
.gridn span{aspect-ratio:1;display:grid;place-items:center;font:700 .62rem var(--body);border-radius:5px;transition:.2s}
.gridn span.sc{outline:2px solid var(--red);transform:scale(1.18);z-index:1;position:relative}

/* desenho */
.pad{display:block;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:18px;border:1.5px solid var(--lilac);background:#101018;touch-action:none;cursor:crosshair;box-shadow:0 0 40px rgba(96,21,245,.4)}
.cls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cls button{border:1.5px solid var(--line);background:rgba(255,255,255,.06);border-radius:16px;padding:.5em .2em;cursor:pointer;font-weight:700;font-size:.72rem;transition:.2s}
.cls button:hover{border-color:var(--lilac);background:rgba(255,255,255,.12)}
.cls .e{display:block;font-size:1.4rem}
.pb{display:grid;grid-template-columns:30px 1fr 42px;gap:8px;align-items:center;margin:.35rem 0;font-weight:700;font-size:.85rem}
.pb .meter{height:14px}
.pb.top i{background:linear-gradient(90deg,var(--violet),#fff)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs canvas{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);image-rendering:pixelated;animation:ptin .4s both}
.shelf{display:grid;grid-template-columns:30px 1fr;gap:6px 10px;align-items:center;font-size:.8rem}
.near{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:.82rem;color:var(--mist)}
.near canvas{width:54px;height:54px;border-radius:8px;border:1px solid var(--lilac);image-rendering:pixelated;background:#101018}

/* fim */
.wins{display:grid;gap:10px;margin-top:12px}
.win{display:flex;gap:12px;align-items:flex-start;animation:in .6s var(--ease) both}
.win .e{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:linear-gradient(140deg,var(--violet),var(--deep))}
.win p{margin:.1rem 0 0;color:var(--mist);font-size:.9rem}
.badge{text-align:center;padding:22px;border-radius:26px;border:1px solid rgba(255,255,255,.4);background:linear-gradient(150deg,rgba(96,21,245,.8),rgba(38,6,141,.9));box-shadow:0 30px 80px -25px rgba(96,21,245,.95);margin-top:14px}
.badge .big{font-size:1.6rem}

/* explicações */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:.5em;padding:.45em .9em;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:.8rem;font-weight:600}
.legend b{color:var(--lilac);font-family:var(--display);font-size:.62rem;letter-spacing:.12em}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.why{border-radius:18px;border:1px dashed var(--lilac);background:rgba(96,21,245,.14);padding:12px 14px;font-size:.88rem;line-height:1.45}
.why h3{font-size:.7rem;letter-spacing:.18em;color:var(--lilac);margin-bottom:6px;text-transform:uppercase}
.wrow{padding:.35em 0;border-top:1px solid rgba(255,255,255,.1)}
.wrow:first-of-type{border-top:0}
.wrow .wl{display:block;font:700 .62rem var(--display);letter-spacing:.14em;color:var(--lilac);text-transform:uppercase;margin-bottom:.1em}
.why b{color:#fff}
.wrow.new{animation:flash .9s}
@keyframes flash{from{background:rgba(169,139,255,.35)}to{background:transparent}}
.map{border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:12px 14px}
.map h3{font-size:.7rem;letter-spacing:.18em;color:var(--lilac);text-transform:uppercase;margin-bottom:8px}
.mr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:.45em 0;border-top:1px solid rgba(255,255,255,.1);font-size:.85rem}
.mr:first-of-type{border-top:0}
.mr .a{font-weight:600}.mr .z{color:var(--lilac);font-weight:700}.mr .ar{color:var(--mist)}
.mr .z em{font-style:normal;display:block;font:700 .58rem var(--display);letter-spacing:.14em;color:var(--mist);text-transform:uppercase}
.bridge{display:flex;gap:12px;align-items:flex-start;border-radius:20px;border:1px dashed var(--lilac);background:rgba(96,21,245,.14);padding:14px 16px;margin:12px 0}
.bridge .e{font-size:1.6rem;flex:none}
.bridge p{margin:0;font-size:.92rem}
.bridge b{color:var(--lilac)}
.ingame{margin-top:6px;padding:.5em .8em;border-radius:12px;background:rgba(255,255,255,.07);font-size:.88rem}
.ingame b{color:var(--lilac)}
/* nav */
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(23,23,31,.97) 70%,rgba(23,23,31,0))}
.nav .hint{flex:1;text-align:center;font-size:.76rem;color:var(--mist)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.stage{scroll-behavior:auto}}
</style>
</head>

 function render(){px.clearRect(0,0,320,320);px.fillStyle='#101018';px.fillRect(0,0,320,320);var c=40;for(var i=0;i<64;i++){var x=(i%8)*c,y=Math.floor(i/8)*c;if(G[i]){px.fillStyle='#fff';px.shadowColor='#A98BFF';px.shadowBlur=10;px.fillRect(x+2,y+2,c-4,c-4);px.shadowBlur=0}}
  px.strokeStyle='rgba(169,139,255,.2)';px.lineWidth=1;for(var k=1;k<8;k++){px.beginPath();px.moveTo(k*c,0);px.lineTo(k*c,320);px.moveTo(0,k*c);px.lineTo(320,k*c);px.stroke()}}
 function cellAt(e){var r=pad.getBoundingClientRect();return clamp(Math.floor((e.clientX-r.left)/r.width*8),0,7)+clamp(Math.floor((e.clientY-r.top)/r.height*8),0,7)*8}
 function setCell(e){var i=cellAt(e);if(G[i]!==paint){G[i]=paint;render();predict();sfx.tick()}}
 pad.onpointerdown=function(e){pad.setPointerCapture(e.pointerId);down_=true;var i=cellAt(e);paint=G[i]?0:1;if(!$('#ers',el)._er)paint=1;if($('#ers',el)._er)paint=0;setCell(e)};
 pad.onpointermove=function(e){if(down_)setCell(e)};pad.onpointerup=pad.onpointercancel=function(){down_=false};
 var ers=$('#ers',el);ers._er=false;ers.onclick=function(){ers._er=!ers._er;ers.textContent=ers._er?'🩹 Apagando':'✏️ Pintar';ers.classList.toggle('ghost',!ers._er)};
 $('#clr',el).onclick=function(){G.fill(0);render();predict();sfx.pop()};
 $('#noi',el).onclick=function(){for(var k=0;k<5;k++){var i=Math.floor(Math.random()*64);G[i]=1-G[i]}render();predict();sfx.pop();say('Bagunçei <b>5 pixels</b> do seu desenho. Será que o SKEM ainda reconhece?','think')};
 function tpl(k){var v=[];TPL[k].forEach(function(r){for(var i=0;i<8;i++)v.push(+r[i])});return v}
 function thumb(v,s){var c=document.createElement('canvas');c.width=c.height=8;var x=c.getContext('2d');x.fillStyle='#101018';x.fillRect(0,0,8,8);x.fillStyle='#fff';for(var i=0;i<64;i++)if(v[i])x.fillRect(i%8,Math.floor(i/8),1,1);return c}
 var cls=$('#cls',el);CL.forEach(function(c){var b=h('<button type="button"><span class="e">'+c.e+'</span>'+c.n+'</button>');b.onclick=function(){teach(c.k)};cls.appendChild(b)});
 function teach(k,v,silent){v=v||G.slice();if(v.every(function(x){return !x})){say('O quadro está vazio! Desenhe algo primeiro.','think');return}BOOK[k].push(v);taught++;shelf();if(!silent){sfx.ok();buzz();addXP(8);var c=CL.filter(function(x){return x.k===k})[0];say('Você deu o <b>rótulo '+c.e+'</b> a esse desenho. O SKEM guardou os 64 números dele como exemplo de '+c.n+'.');if(k!=='T')G.fill(0),render();else{G.fill(0);render()}}predict()}
 function shelf(){var s=$('#shelf',el);s.innerHTML='';CL.forEach(function(c){s.appendChild(h('<span style="font-size:1.3rem">'+c.e+'</span>'));var t=document.createElement('div');t.className='thumbs';BOOK[c.k].slice(-8).forEach(function(v){t.appendChild(thumb(v))});if(!BOOK[c.k].length)t.innerHTML='<span class="note" style="margin:0">nenhum exemplo ainda</span>';s.appendChild(t)})}
 $('#auto',el).onclick=async function(){this.disabled=true;say('Vou dar <b>3 exemplos rotulados</b> de cada, com pixels bagunçados para variar!','think');for(var r=0;r<3;r++){['O','X','P'].forEach(function(k){var v=tpl(k);for(var f=0;f<(r?3:0);f++){var i=Math.floor(Math.random()*64);v[i]=1-v[i]}BOOK[k].push(v);taught++});shelf();sfx.pop();await wait(260)}addXP(20);say('Treino feito! Agora é o <b>teste</b>: desenhe um <b>⭕</b>, <b>❌</b> ou <b>➕</b> do seu jeito e veja a <b>previsão</b>.','wow');this.disabled=false;predict()};
 function predict(){var pb=$('#pb',el),near=$('#near',el),have=CL.filter(function(c){return BOOK[c.k].length});
  if(have.length<2){pb.innerHTML='<p class="note">Ensine pelo menos <b>2 tipos</b> de desenho para ele poder comparar.</p>';near.innerHTML='';return}
  if(G.every(function(x){return !x})){pb.innerHTML='<p class="note">Desenhe algo no quadro...</p>';near.innerHTML='';return}
  var sc=[],bestAll=null;have.forEach(function(c){var m=99,mv=null;BOOK[c.k].forEach(function(v){var d=0;for(var i=0;i<64;i++)if(v[i]!==G[i])d++;if(d<m){m=d;mv=v}});sc.push({c:c,d:m,s:Math.exp(-m/3.2)});if(!bestAll||m<bestAll.d)bestAll={d:m,v:mv,c:c}});
  var tot=sc.reduce(function(a,b){return a+b.s},0)||1;sc.sort(function(a,b){return b.s-a.s});
  pb.innerHTML=sc.map(function(o,i){var p=Math.round(o.s/tot*100);return '<div class="pb'+(i?'':' top')+'"><span style="font-size:1.2rem">'+o.c.e+'</span><div class="meter"><i style="width:'+p+'%"></i></div><span>'+p+'%</span></div>'}).join('');
  near.innerHTML='';var cn=thumb(bestAll.v);near.appendChild(cn);near.appendChild(h('<span>Mais parecido com este exemplo de <b>'+bestAll.c.e+' '+bestAll.c.n+'</b> (diferença: '+bestAll.d+' pixels)</span>'));
  if(!testedOnce){testedOnce=true;addXP(15)}}
 /* mensagens quando desenha sem ensinar triângulo */
 var warned=false;
 pad.addEventListener('pointerup',function(){var have=CL.filter(function(c){return BOOK[c.k].length});if(have.length>=2){var top=$('#pb .pb.top',el);if(top&&!BOOK.T.length&&!warned&&G.filter(Boolean).length>6){warned=true;say('Desenhou um <b>triângulo</b>? Ele erra: nunca viu um! Ensine com o botão <b>🔺</b>.','think')}}});
 setGate(true);shelf();render();predict();
 say('Desenhe um <b>⭕</b> no quadro e toque em <b>⭕ Bolinha</b>: esse toque é o <b>rótulo</b>. Ou use os <b>exemplos prontos</b>!');
 return null};

/* ===================== FASE 5: FIM ===================== */
LEVELS[5]=function(el){
 var tier=S.xp>=250?'Mestre':S.xp>=150?'Treinador':'Aprendiz';
 el.innerHTML='<p class="eyebrow">Missão cumprida</p><h1>Você treinou o <span class="g">SKEM</span><span class="dot"></span></h1><p class="lead">Resumo do que você acabou de ver na prática:</p><div class="wins" id="wins"></div>'+
 '<div class="badge"><span class="tag" style="color:#E4DCFF">Seu título no clube</span><div class="big" style="margin:.4rem 0">'+tier+' de IA 🤖</div><p class="note" style="color:#E4DCFF">'+S.xp+' XP · SKEM.AI</p></div>'+
 '<div class="row" style="margin-top:14px;justify-content:center"><button class="btn" id="again" type="button">↻ Jogar de novo</button></div>';
 var W=[['🏷️','Aprendizado supervisionado','Aprende com exemplos que já têm a resposta (rótulo). Dado + rótulo → modelo → previsão.','Você clicou em 🍋 e 🍎 e viu a linha branca aprender.'],['🧪','Treino × teste','Treina com um conjunto e confere em dados novos. A nota de verdade vem da prova, não do treino.','Você viu o SKEM prever 20 frutas que nunca tinha visto.'],['📈','Mais dados, melhor modelo','Mais exemplos corretos melhoram o aprendizado. Rótulos errados pioram: lixo entra, lixo sai.','Você mexeu no laboratório e ligou o professor distraído.'],['🔢','Imagem = números','Pixels são números (0 a 255; cores têm R, G e B). É isso que o modelo recebe.','Você deu zoom nos pixels e misturou cores.'],['✍️','Tudo junto','Desenhos viram listas de números e o modelo compara com os exemplos que aprendeu.','Você ensinou o SKEM a reconhecer ⭕ ❌ ➕.']];
 var box=$('#wins',el);W.forEach(function(w,i){var d=h('<div class="win" style="animation-delay:'+(i*160)+'ms"><div class="e">'+w[0]+'</div><div><h3>'+w[1]+'</h3><p>'+w[2]+'</p><div class="ingame">🎮 <b>No jogo:</b> '+w[3]+'</div></div></div>');box.appendChild(d)});
 $('#again',el).onclick=function(){S.xp=0;S.model=null;S.labels={};S.tested=false;S.visited={};addXP(0);$('#xp').textContent='0';go(0)};
 confetti();sfx.win();say('Missão cumprida! 🎉 A IA <b>aprende com exemplos</b> e <b>enxerga imagens</b> como números.','wow');
 return null};

addXP(0);go(0);
})();
</script>
